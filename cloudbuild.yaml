# Cloud Build: build showcase, stage dist/, deploy Firebase Hosting.
#
# 1) Create a CI token (run locally once):
#      firebase login:ci
#    Store the token in Secret Manager, e.g. secret id: firebase-token
#
# 2) Grant Cloud Build access to the secret:
#      PROJECT_ID=your-gcp-project
#      PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
#      gcloud secrets add-iam-policy-binding firebase-token \
#        --project="$PROJECT_ID" \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#
# 3) Set substitution _FIREBASE_PROJECT to your Firebase project id (same as .firebaserc default).
#
# 4) Create a trigger on push to main/master pointing at this file.
#
substitutions:
  _FIREBASE_PROJECT: REPLACE_WITH_FIREBASE_PROJECT_ID

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/firebase-token/versions/latest
      env: FIREBASE_TOKEN

steps:
  - id: build-showcase
    name: python:3.12-slim
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 generator/build-showcase.py
        rm -rf dist
        mkdir -p dist
        cp index.html dist/
        cp -r showcase dist/showcase

  - id: firebase-deploy
    name: node:20
    dir: .
    secretEnv:
      - FIREBASE_TOKEN
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm install -g firebase-tools@latest
        firebase deploy --only hosting --non-interactive \
          --project ${_FIREBASE_PROJECT} \
          --token "$$FIREBASE_TOKEN"
