<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Gantt chart template</title>
  <desc id="desc">Horizontal bars on a time axis with milestones and dependencies</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="340" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  project schedule]</text>

    <!-- Time axis labels -->
    <text x="160" y="40" text-anchor="middle" font-size="9" fill="#708090">Week 1</text>
    <text x="280" y="40" text-anchor="middle" font-size="9" fill="#708090">Week 2</text>
    <text x="400" y="40" text-anchor="middle" font-size="9" fill="#708090">Week 3</text>
    <text x="520" y="40" text-anchor="middle" font-size="9" fill="#708090">Week 4</text>
    <text x="620" y="40" text-anchor="middle" font-size="9" fill="#708090">Week 5</text>

    <!-- Grid lines -->
    <g stroke="#1f2937" stroke-width="1">
      <line x1="100" y1="46" x2="100" y2="190"/>
      <line x1="220" y1="46" x2="220" y2="190"/>
      <line x1="340" y1="46" x2="340" y2="190"/>
      <line x1="460" y1="46" x2="460" y2="190"/>
      <line x1="580" y1="46" x2="580" y2="190"/>
      <line x1="660" y1="46" x2="660" y2="190"/>
    </g>

    <!-- Row labels -->
    <text x="14" y="72" font-size="10" fill="#F1F5F9" font-weight="600">Task A</text>
    <text x="14" y="102" font-size="10" fill="#F1F5F9" font-weight="600">Task B</text>
    <text x="14" y="132" font-size="10" fill="#F1F5F9" font-weight="600">Task C</text>
    <text x="14" y="162" font-size="10" fill="#F1F5F9" font-weight="600">Task D</text>
    <text x="14" y="188" font-size="10" fill="#F1F5F9" font-weight="600">Task E</text>

    <!-- Bars -->
    <rect x="100" y="58" width="200" height="20" rx="3" fill="#3d5a80"/>
    <rect x="220" y="88" width="180" height="20" rx="3" fill="#2c5282"/>
    <rect x="340" y="118" width="200" height="20" rx="3" fill="#285e61"/>
    <rect x="460" y="148" width="140" height="20" rx="3" fill="#744210"/>
    <rect x="580" y="174" width="80" height="20" rx="3" fill="#553c9a"/>

    <!-- Milestone diamond -->
    <polygon points="540,128 548,118 556,128 548,138" fill="#F59E0B"/>
    <text x="548" y="152" text-anchor="middle" font-size="8" fill="#F59E0B" font-weight="600">M1</text>

    <!-- Dependency arrow -->
    <line x1="300" y1="78" x2="300" y2="88" stroke="#0e7490" stroke-width="1.5"/>
    <polygon points="300,88 296,82 304,82" fill="#708090"/>
  </g>
  <text x="340" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  schedule constraints or critical path]</text>
</svg>
