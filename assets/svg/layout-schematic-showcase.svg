<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="lt">
  <title id="lt">showcase_page layout schematic</title>
  <rect width="100%" height="100%" fill="#111827"/>
  <text x="200" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">Viewport (browser)</text>
  <g data-node="Site header" pointer-events="all">
    <rect x="24" y="36" width="352" height="44" rx="4" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
    <text x="200" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#06B6D4" font-weight="600">Site header</text>
    <text x="200" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">brand / breadcrumb / H1</text>
  </g>
  <g data-node="Sidebar" pointer-events="all">
    <rect x="24" y="92" width="72" height="148" rx="4" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.4)" stroke-width="1.2"/>
    <text x="60" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#06B6D4" font-weight="600">Sidebar</text>
    <text x="60" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">nav rail</text>
  </g>
  <g data-node="Main content" pointer-events="all">
    <rect x="108" y="92" width="188" height="148" rx="4" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.45)" stroke-width="1.2"/>
    <text x="202" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F59E0B" font-weight="600">Main content</text>
    <text x="202" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">body_html, max-width column</text>
  </g>
  <g data-node="ToC" pointer-events="all">
    <rect x="308" y="92" width="68" height="148" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.45)" stroke-width="1.2"/>
    <text x="342" y="124" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#10B981" font-weight="600">ToC</text>
    <text x="342" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">optional</text>
  </g>
</svg>
