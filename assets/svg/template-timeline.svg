<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Timeline template</title>
  <desc id="desc">Horizontal milestone chain with date markers and event descriptions</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="340" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  milestone timeline]</text>

    <!-- Main axis line -->
    <line x1="40" y1="90" x2="640" y2="90" stroke="#334155" stroke-width="2"/>

    <!-- Event 1 (above) -->
    <circle cx="100" cy="90" r="6" fill="#3d5a80" stroke="#06B6D4" stroke-width="2"/>
    <line x1="100" y1="84" x2="100" y2="50" stroke="#334155" stroke-width="1"/>
    <text x="100" y="44" text-anchor="middle" font-weight="700" font-size="10" fill="#F1F5F9">Event A</text>
    <text x="100" y="110" text-anchor="middle" font-size="9" fill="#708090">[date]</text>

    <!-- Event 2 (below) -->
    <circle cx="230" cy="90" r="6" fill="#2c5282" stroke="#06B6D4" stroke-width="2"/>
    <line x1="230" y1="96" x2="230" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="230" y="144" text-anchor="middle" font-weight="700" font-size="10" fill="#F1F5F9">Event B</text>
    <text x="230" y="74" text-anchor="middle" font-size="9" fill="#708090">[date]</text>

    <!-- Event 3 (above) -->
    <circle cx="370" cy="90" r="6" fill="#285e61" stroke="#06B6D4" stroke-width="2"/>
    <line x1="370" y1="84" x2="370" y2="50" stroke="#334155" stroke-width="1"/>
    <text x="370" y="44" text-anchor="middle" font-weight="700" font-size="10" fill="#F1F5F9">Event C</text>
    <text x="370" y="110" text-anchor="middle" font-size="9" fill="#708090">[date]</text>

    <!-- Event 4 (below) -->
    <circle cx="500" cy="90" r="6" fill="#744210" stroke="#F59E0B" stroke-width="2"/>
    <line x1="500" y1="96" x2="500" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="500" y="144" text-anchor="middle" font-weight="700" font-size="10" fill="#F1F5F9">Event D</text>
    <text x="500" y="74" text-anchor="middle" font-size="9" fill="#708090">[date]</text>

    <!-- Event 5 (above) -->
    <circle cx="600" cy="90" r="6" fill="#553c9a" stroke="#a78bfa" stroke-width="2"/>
    <line x1="600" y1="84" x2="600" y2="50" stroke="#334155" stroke-width="1"/>
    <text x="600" y="44" text-anchor="middle" font-weight="700" font-size="10" fill="#F1F5F9">Event E</text>
    <text x="600" y="110" text-anchor="middle" font-size="9" fill="#708090">[date]</text>
  </g>
  <text x="340" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  release cadence or planning horizon]</text>
</svg>
