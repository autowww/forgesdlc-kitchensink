<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Line chart template</title>
  <desc id="desc">Trend lines with data-point dots on an x/y axis grid</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="200" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  trend over time]</text>

    <!-- Y-axis -->
    <line x1="60" y1="36" x2="60" y2="210" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="48" text-anchor="end" font-size="8" fill="#708090">100</text>
    <text x="50" y="92" text-anchor="end" font-size="8" fill="#708090">75</text>
    <text x="50" y="136" text-anchor="end" font-size="8" fill="#708090">50</text>
    <text x="50" y="180" text-anchor="end" font-size="8" fill="#708090">25</text>
    <text x="50" y="214" text-anchor="end" font-size="8" fill="#708090">0</text>

    <!-- Grid -->
    <g stroke="#1f2937" stroke-width="0.5">
      <line x1="60" y1="44" x2="380" y2="44"/>
      <line x1="60" y1="88" x2="380" y2="88"/>
      <line x1="60" y1="132" x2="380" y2="132"/>
      <line x1="60" y1="176" x2="380" y2="176"/>
    </g>

    <!-- X-axis -->
    <line x1="60" y1="210" x2="380" y2="210" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="226" text-anchor="middle" font-size="8" fill="#708090">Jan</text>
    <text x="164" y="226" text-anchor="middle" font-size="8" fill="#708090">Feb</text>
    <text x="228" y="226" text-anchor="middle" font-size="8" fill="#708090">Mar</text>
    <text x="292" y="226" text-anchor="middle" font-size="8" fill="#708090">Apr</text>
    <text x="356" y="226" text-anchor="middle" font-size="8" fill="#708090">May</text>

    <!-- Series A (cyan) -->
    <polyline points="100,170 164,140 228,100 292,80 356,55" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="100" cy="170" r="4" fill="#06B6D4"/>
    <circle cx="164" cy="140" r="4" fill="#06B6D4"/>
    <circle cx="228" cy="100" r="4" fill="#06B6D4"/>
    <circle cx="292" cy="80" r="4" fill="#06B6D4"/>
    <circle cx="356" cy="55" r="4" fill="#06B6D4"/>

    <!-- Series B (amber) -->
    <polyline points="100,190 164,175 228,160 292,150 356,120" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="100" cy="190" r="4" fill="#F59E0B"/>
    <circle cx="164" cy="175" r="4" fill="#F59E0B"/>
    <circle cx="228" cy="160" r="4" fill="#F59E0B"/>
    <circle cx="292" cy="150" r="4" fill="#F59E0B"/>
    <circle cx="356" cy="120" r="4" fill="#F59E0B"/>

    <!-- Legend -->
    <line x1="100" y1="240" x2="120" y2="240" stroke="#06B6D4" stroke-width="2"/>
    <text x="125" y="244" font-size="9" fill="#F1F5F9">Series A</text>
    <line x1="190" y1="240" x2="210" y2="240" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="215" y="244" font-size="9" fill="#F1F5F9">Series B</text>
  </g>
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  data source or sampling period]</text>
</svg>
