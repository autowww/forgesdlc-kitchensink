<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Loop / cycle template</title>
  <desc id="desc">Circular flow with four phases returning to the start</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="200" y="22" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  -  iterative cycle]</text>

    <rect x="140" y="38" width="120" height="44" rx="4" fill="#1a2235"/>
    <text x="200" y="58" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Phase 1</text>
    <text x="200" y="72" text-anchor="middle" fill="#F1F5F9" font-size="9">[plan]</text>

    <rect x="270" y="128" width="120" height="44" rx="4" fill="#1e2d42"/>
    <text x="330" y="148" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Phase 2</text>
    <text x="330" y="162" text-anchor="middle" fill="#F1F5F9" font-size="9">[execute]</text>

    <rect x="140" y="218" width="120" height="44" rx="4" fill="#1c3148"/>
    <text x="200" y="238" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Phase 3</text>
    <text x="200" y="252" text-anchor="middle" fill="#F1F5F9" font-size="9">[review]</text>

    <rect x="10" y="128" width="120" height="44" rx="4" fill="rgba(245,158,11,0.22)"/>
    <text x="70" y="148" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Phase 4</text>
    <text x="70" y="162" text-anchor="middle" fill="#F1F5F9" font-size="9">[adapt]</text>
  </g>

  <!-- Connectors: 1'2 -->
  <line x1="260" y1="70" x2="278" y2="128" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
  <polygon points="278,128 272,122 280,121" fill="#94a3b8"/>
  <!-- 2'3 -->
  <line x1="278" y1="172" x2="260" y2="218" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
  <polygon points="260,218 262,210 268,214" fill="#94a3b8"/>
  <!-- 3'4 -->
  <line x1="140" y1="248" x2="122" y2="172" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
  <polygon points="122,172 118,180 126,180" fill="#94a3b8"/>
  <!-- 4'1 -->
  <line x1="122" y1="128" x2="140" y2="74" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
  <polygon points="140,74 134,80 140,82" fill="#94a3b8"/>

  <text x="200" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B">» repeat</text>
  <text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  -  cycle cadence or exit criteria]</text>
</svg>
