<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 100" width="700" height="100" role="img" aria-labelledby="title desc">
  <title id="title">Gate chain template</title>
  <desc id="desc">Stages separated by diamond-shaped gate checkpoints</desc>
  <rect width="100%" height="100%" fill="none"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="350" y="16" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  gated process]</text>

    <!-- Stage 1 -->
    <rect x="10" y="30" width="120" height="48" rx="4" fill="#2c5282"/>
    <text x="70" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">Stage 1</text>
    <text x="70" y="66" text-anchor="middle" fill="#fff" font-size="9">[activity]</text>

    <!-- Gate A -->
    <polygon points="180,54 196,38 212,54 196,70" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="196" y="58" text-anchor="middle" fill="#F59E0B" font-weight="700" font-size="9">G</text>

    <!-- Stage 2 -->
    <rect x="240" y="30" width="120" height="48" rx="4" fill="#285e61"/>
    <text x="300" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">Stage 2</text>
    <text x="300" y="66" text-anchor="middle" fill="#fff" font-size="9">[activity]</text>

    <!-- Gate B -->
    <polygon points="410,54 426,38 442,54 426,70" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="426" y="58" text-anchor="middle" fill="#F59E0B" font-weight="700" font-size="9">G</text>

    <!-- Stage 3 -->
    <rect x="470" y="30" width="120" height="48" rx="4" fill="#744210"/>
    <text x="530" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">Stage 3</text>
    <text x="530" y="66" text-anchor="middle" fill="#fff" font-size="9">[activity]</text>

    <!-- Final marker -->
    <rect x="630" y="38" width="40" height="32" rx="16" fill="#553c9a"/>
    <text x="650" y="58" text-anchor="middle" fill="#fff" font-weight="700" font-size="10"></text>
  </g>

  <g stroke="#0e7490" stroke-width="1.5" fill="none">
    <path d="M 130 54 L 180 54"/>
    <path d="M 212 54 L 240 54"/>
    <path d="M 360 54 L 410 54"/>
    <path d="M 442 54 L 470 54"/>
    <path d="M 590 54 L 630 54"/>
  </g>
  <g fill="#708090">
    <polygon points="180,54 174,50 174,58"/>
    <polygon points="240,54 234,50 234,58"/>
    <polygon points="410,54 404,50 404,58"/>
    <polygon points="470,54 464,50 464,58"/>
    <polygon points="630,54 624,50 624,58"/>
  </g>

  <text x="350" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  gate criteria or escalation policy]</text>
</svg>
