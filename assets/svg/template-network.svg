<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Network / topology template</title>
  <desc id="desc">Node-and-edge graph showing connections between peers</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="240" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  network topology]</text>

    <!-- Edges (drawn first, behind nodes) -->
    <g stroke="#475569" stroke-width="1.5" fill="none">
      <line x1="240" y1="80" x2="100" y2="150"/>
      <line x1="240" y1="80" x2="380" y2="150"/>
      <line x1="240" y1="80" x2="240" y2="170"/>
      <line x1="100" y1="150" x2="160" y2="260"/>
      <line x1="100" y1="150" x2="240" y2="170"/>
      <line x1="380" y1="150" x2="320" y2="260"/>
      <line x1="380" y1="150" x2="240" y2="170"/>
      <line x1="160" y1="260" x2="320" y2="260"/>
    </g>

    <!-- Hub node -->
    <circle cx="240" cy="70" r="28" fill="#111827" stroke="#06B6D4" stroke-width="2"/>
    <text x="240" y="75" text-anchor="middle" fill="#06B6D4" font-weight="700" font-size="11">Hub</text>

    <!-- Node A -->
    <circle cx="100" cy="150" r="24" fill="#111827" stroke="#1e2d42" stroke-width="2"/>
    <text x="100" y="155" text-anchor="middle" fill="#F1F5F9" font-weight="600" font-size="10">Node A</text>

    <!-- Node B -->
    <circle cx="380" cy="150" r="24" fill="#111827" stroke="#1c3148" stroke-width="2"/>
    <text x="380" y="155" text-anchor="middle" fill="#F1F5F9" font-weight="600" font-size="10">Node B</text>

    <!-- Node C -->
    <circle cx="240" cy="180" r="24" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="240" y="185" text-anchor="middle" fill="#F59E0B" font-weight="600" font-size="10">Node C</text>

    <!-- Node D -->
    <circle cx="160" cy="260" r="24" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="265" text-anchor="middle" fill="#F59E0B" font-weight="600" font-size="10">Node D</text>

    <!-- Node E -->
    <circle cx="320" cy="260" r="24" fill="#111827" stroke="rgba(245,158,11,0.22)" stroke-width="2"/>
    <text x="320" y="265" text-anchor="middle" fill="#F1F5F9" font-weight="600" font-size="10">Node E</text>
  </g>
  <text x="240" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  connection types or dependency rules]</text>
</svg>
