<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Waterfall chart template</title>
  <desc id="desc">Bridge of floating bars from start through changes to total</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="200" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  variance bridge]</text>

    <line x1="48" y1="40" x2="48" y2="220" stroke="#475569" stroke-width="1.5"/>
    <line x1="48" y1="220" x2="372" y2="220" stroke="#475569" stroke-width="1.5"/>
    <text x="38" y="52" text-anchor="end" font-size="8" fill="#94a3b8">120</text>
    <text x="38" y="100" text-anchor="end" font-size="8" fill="#94a3b8">90</text>
    <text x="38" y="148" text-anchor="end" font-size="8" fill="#94a3b8">60</text>
    <text x="38" y="196" text-anchor="end" font-size="8" fill="#94a3b8">30</text>
    <text x="38" y="224" text-anchor="end" font-size="8" fill="#94a3b8">0</text>

    <g stroke="rgba(6,182,212,0.12)" stroke-width="0.5">
      <line x1="48" y1="60" x2="372" y2="60"/>
      <line x1="48" y1="110" x2="372" y2="110"/>
      <line x1="48" y1="160" x2="372" y2="160"/>
    </g>

    <!-- Connectors (dashed) -->
    <g stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" fill="none">
      <line x1="92" y1="100" x2="116" y2="100"/>
      <line x1="160" y1="130" x2="184" y2="130"/>
      <line x1="228" y1="88" x2="252" y2="88"/>
      <line x1="296" y1="118" x2="320" y2="118"/>
    </g>

    <g data-node="Start" pointer-events="all">
    <rect x="60" y="100" width="32" height="120" rx="2" fill="#1a2235"/>
    <text x="76" y="94" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">100</text>
    <text x="76" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">Start</text>
    </g>

    <g data-node="Chg Revenue" pointer-events="all">
    <rect x="116" y="70" width="32" height="30" rx="2" fill="rgba(16,185,129,0.45)"/>
    <text x="132" y="88" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">+15</text>
    <text x="132" y="238" text-anchor="middle" font-size="8" fill="#94a3b8">+Rev</text>
    </g>

    <g data-node="Chg Cost" pointer-events="all">
    <rect x="172" y="130" width="32" height="42" rx="2" fill="rgba(239,68,68,0.35)"/>
    <text x="188" y="124" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">-12</text>
    <text x="188" y="238" text-anchor="middle" font-size="8" fill="#94a3b8">-Cost</text>
    </g>

    <g data-node="Chg Risk" pointer-events="all">
    <rect x="228" y="88" width="32" height="28" rx="2" fill="rgba(16,185,129,0.35)"/>
    <text x="244" y="82" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">+8</text>
    <text x="244" y="238" text-anchor="middle" font-size="8" fill="#94a3b8">+Risk</text>
    </g>

    <g data-node="Total" pointer-events="all">
    <rect x="284" y="118" width="32" height="102" rx="2" fill="#1c3148"/>
    <text x="300" y="112" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">111</text>
    <text x="300" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">Total</text>
    </g>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  units and sign convention]</text>
</svg>
