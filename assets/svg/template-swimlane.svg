<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Swimlane template</title>
  <desc id="desc">Horizontal lanes grouping parallel processes by role or team</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g transform="translate(0, 30)">
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="340" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  cross-team process]</text>

    <!-- Lane A -->
    <rect x="10" y="30" width="660" height="56" rx="6" fill="none" stroke="#1e2d42" stroke-width="1.5"/>
    <text x="24" y="62" font-weight="700" font-size="10" fill="#94A3B8">Role A</text>
    <rect x="80" y="40" width="100" height="36" rx="8" fill="#1a2235"/>
    <text x="130" y="63" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step A</text>
    <rect x="320" y="40" width="100" height="36" rx="8" fill="#1a2235"/>
    <text x="370" y="63" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step D</text>

    <!-- Lane B -->
    <rect x="10" y="90" width="660" height="56" rx="6" fill="none" stroke="#1c3148" stroke-width="1.5"/>
    <text x="24" y="122" font-weight="700" font-size="10" fill="#94A3B8">Role B</text>
    <rect x="200" y="100" width="100" height="36" rx="8" fill="#1c3148"/>
    <text x="250" y="123" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step B</text>
    <rect x="440" y="100" width="100" height="36" rx="8" fill="#1c3148"/>
    <text x="490" y="123" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step E</text>

    <!-- Lane C -->
    <rect x="10" y="150" width="660" height="56" rx="6" fill="none" stroke="rgba(245,158,11,0.22)" stroke-width="1.5"/>
    <text x="24" y="182" font-weight="700" font-size="10" fill="#F59E0B">Role C</text>
    <rect x="200" y="160" width="100" height="36" rx="8" fill="rgba(245,158,11,0.22)"/>
    <text x="250" y="183" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step C</text>
    <rect x="560" y="160" width="100" height="36" rx="8" fill="rgba(245,158,11,0.22)"/>
    <text x="610" y="183" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Step F</text>
  </g>

  <!-- Connectors crossing lanes -->
  <g stroke="rgba(6,182,212,0.55)" stroke-width="1.5" fill="none">
    <path d="M 180 58 L 200 118"/>
    <path d="M 300 118 L 320 58"/>
    <path d="M 300 118 L 200 178"/>
    <path d="M 420 58 L 440 118"/>
    <path d="M 540 118 L 560 178"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="200,118 196,110 202,112"/>
    <polygon points="320,58 316,66 322,64"/>
    <polygon points="200,178 196,170 202,172"/>
    <polygon points="440,118 436,110 442,112"/>
    <polygon points="560,178 556,170 562,172"/>
  </g>
  <text x="340" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  handoff points and lane responsibilities]</text>
  </g>
</svg>
