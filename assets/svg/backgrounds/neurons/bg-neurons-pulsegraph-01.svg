<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="800" height="450" fill="none"/>
  <g stroke="color-mix(in srgb, var(--forge-text-3, #708090) 40%, transparent)" stroke-width="1.87" fill="none">
    <line x1="100" y1="200" x2="250" y2="180"/><line x1="250" y1="180" x2="400" y2="220"/><line x1="400" y1="220" x2="550" y2="190"/><line x1="550" y1="190" x2="700" y2="210"/>
    <line x1="180" y1="280" x2="320" y2="300"/><line x1="320" y1="300" x2="480" y2="270"/><line x1="480" y1="270" x2="640" y2="290"/>
    <line x1="250" y1="180" x2="320" y2="300"/><line x1="400" y1="220" x2="480" y2="270"/>
  </g>
  <line x1="100" y1="200" x2="250" y2="180" stroke="var(--forge-cyan, #06B6D4)" stroke-width="2.64" fill="none" opacity="0.35" stroke-dasharray="8 14" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-88;0" dur="16.8s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <line x1="400" y1="220" x2="550" y2="190" stroke="var(--forge-amber, #F59E0B)" stroke-width="2.2" fill="none" opacity="0.3" stroke-dasharray="6 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-72;0" dur="22.4s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <line x1="320" y1="300" x2="480" y2="270" stroke="var(--forge-emerald, #10B981)" stroke-width="2.2" fill="none" opacity="0.28" stroke-dasharray="10 16" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-104;0" dur="19.6s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <g fill="var(--forge-text-2, #94A3B8)">
    <circle cx="100" cy="200" r="8.75"/><circle cx="250" cy="180" r="8.75"/><circle cx="400" cy="220" r="9.8"/><circle cx="550" cy="190" r="8.4"/><circle cx="700" cy="210" r="7.7"/>
    <circle cx="180" cy="280" r="8.05"/><circle cx="320" cy="300" r="9.1"/><circle cx="480" cy="270" r="8.4"/><circle cx="640" cy="290" r="7.7"/>
