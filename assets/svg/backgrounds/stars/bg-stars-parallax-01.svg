<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="800" height="450" fill="none"/>
  <!-- Radii scaled for ~200px-wide previews: sub-1px user units vanish on screen -->
  <g fill="var(--forge-text-3, #708090)" opacity="0.62">
    <g><animateTransform attributeName="transform" type="translate" values="0,0; -30,8; 0,0" dur="60s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="120" cy="80" r="9.8"/><circle cx="340" cy="120" r="8.4"/><circle cx="580" cy="70" r="9.1"/><circle cx="720" cy="140" r="7.7"/>
      <circle cx="200" cy="200" r="8.05"/><circle cx="480" cy="180" r="9.1"/><circle cx="650" cy="220" r="7.35"/>
    </g>
    <g opacity="0.72"><animateTransform attributeName="transform" type="translate" values="0,0; 45,-12; 0,0" dur="45s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="90" cy="320" r="11.2"><animate attributeName="opacity" values="0.45;0.72;0.45" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="360" r="9.8"><animate attributeName="opacity" values="0.5;0.78;0.5" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="300" r="10.5"><animate attributeName="opacity" values="0.48;0.75;0.48" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="340" r="9.1"><animate attributeName="opacity" values="0.52;0.8;0.52" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <g opacity="0.48"><animateTransform attributeName="transform" type="translate" values="0,0; -20,-15; 0,0" dur="70s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="500" cy="90" r="12" fill="color-mix(in srgb, var(--forge-cyan, #06B6D4) 40%, transparent)"/>
    </g>
  </g>
</svg>
