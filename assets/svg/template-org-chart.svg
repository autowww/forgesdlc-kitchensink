<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Org chart template</title>
  <desc id="desc">People hierarchy with avatar placeholders, name, title, and team line; reporting structure</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="340" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  org structure]</text>

    <!-- Reporting connectors (hover as one zone) -->
    <g data-node="Reporting lines" stroke="rgba(6,182,212,0.45)" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M 340 92 L 340 104"/>
      <path d="M 150 104 L 530 104"/>
      <path d="M 150 104 L 150 116"/>
      <path d="M 530 104 L 530 116"/>
      <path d="M 150 170 L 150 178 L 100 178 L 100 186"/>
      <path d="M 530 170 L 530 178 L 580 178 L 580 186"/>
      <polygon points="340,92 336,86 344,86" fill="#94A3B8" stroke="none"/>
    </g>

    <!-- CEO -->
    <g data-node="CEO card">
      <rect x="250" y="34" width="180" height="58" rx="8" fill="#1a2235" stroke="rgba(6,182,212,0.45)" stroke-width="1.5"/>
      <circle cx="278" cy="63" r="16" fill="#1e2d42" stroke="rgba(6,182,212,0.35)" stroke-width="1.2"/>
      <text x="278" y="66" text-anchor="middle" font-size="9" fill="#64748b">photo</text>
      <text x="302" y="54" font-size="11" font-weight="700" fill="#F1F5F9">Alex Morgan</text>
      <text x="302" y="68" font-size="8" fill="#94A3B8">Chief Executive Officer</text>
      <text x="302" y="80" font-size="7" fill="#64748b">Office of the CEO</text>
    </g>

    <!-- VP Engineering -->
    <g data-node="VP Engineering">
      <rect x="70" y="116" width="160" height="54" rx="8" fill="#1a2235" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
      <circle cx="96" cy="143" r="14" fill="#1e2d42" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
      <text x="96" y="146" text-anchor="middle" font-size="7" fill="#64748b">photo</text>
      <text x="118" y="136" font-size="10" font-weight="700" fill="#F1F5F9">Jordan Lee</text>
      <text x="118" y="149" font-size="7" fill="#94A3B8">VP Engineering</text>
      <text x="118" y="160" font-size="7" fill="#64748b">Engineering</text>
    </g>

    <!-- VP Product -->
    <g data-node="VP Product">
      <rect x="450" y="116" width="160" height="54" rx="8" fill="#1a2235" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
      <circle cx="476" cy="143" r="14" fill="rgba(245,158,11,0.12)" stroke="#F59E0B" stroke-width="1"/>
      <text x="476" y="146" text-anchor="middle" font-size="7" fill="#64748b">photo</text>
      <text x="498" y="136" font-size="10" font-weight="700" fill="#F1F5F9">Sam Rivera</text>
      <text x="498" y="149" font-size="7" fill="#94A3B8">VP Product</text>
      <text x="498" y="160" font-size="7" fill="#64748b">Product</text>
    </g>

    <!-- Individual contributor: Engineering -->
    <g data-node="Engineer">
      <rect x="40" y="186" width="120" height="48" rx="6" fill="#1c3148" stroke="rgba(6,182,212,0.35)" stroke-width="1.2"/>
      <circle cx="62" cy="210" r="12" fill="#1e2d42" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
      <text x="62" y="212" text-anchor="middle" font-size="6" fill="#64748b">photo</text>
      <text x="78" y="204" font-size="9" font-weight="600" fill="#F1F5F9">Casey Ng</text>
      <text x="78" y="216" font-size="7" fill="#94A3B8">Staff Engineer</text>
      <text x="78" y="226" font-size="6.5" fill="#64748b">Platform</text>
    </g>

    <!-- Individual contributor: Design -->
    <g data-node="Designer">
      <rect x="520" y="186" width="120" height="48" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.35)" stroke-width="1.2"/>
      <circle cx="542" cy="210" r="12" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1"/>
      <text x="542" y="212" text-anchor="middle" font-size="6" fill="#64748b">photo</text>
      <text x="558" y="204" font-size="9" font-weight="600" fill="#F1F5F9">Riley Park</text>
      <text x="558" y="216" font-size="7" fill="#94A3B8">Senior Product Designer</text>
      <text x="558" y="226" font-size="6.5" fill="#64748b">Design</text>
    </g>
  </g>
  <text x="340" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  dotted-line reports, contractors, or matrix overlays]</text>
</svg>
