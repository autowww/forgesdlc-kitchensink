<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Gauge / meter template</title>
  <desc id="desc">Radial meter arc with needle showing a metric against a target</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <!--
    Semicircle: center (160,150) r=80, upper arc. Param t from π (left) to 0 (right):
    x = 160 + 80*cos(t), y = 150 - 80*sin(t)
    Zone splits: 0–30%, 30–50%, 50–100% by t = π*(1 - p/100).
    Colored arcs use stroke-linecap="butt" so segment joins stay flush (round caps
    on adjacent strokes cause overlapping bulges at boundaries).
  -->
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="160" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  health score]</text>

    <!-- Background track (single path — round caps only on the outer ends) -->
    <path d="M 80 150 A 80 80 0 0 1 240 150" fill="none" stroke="rgba(6,182,212,0.16)" stroke-width="18" stroke-linecap="round"/>

    <!-- Red 0–30%: t from π to 0.7π -->
    <path d="M 80 150 A 80 80 0 0 1 112.98 85.28" fill="none" stroke="rgba(239,68,68,0.55)" stroke-width="18" stroke-linecap="butt"/>

    <!-- Amber 30–50%: t from 0.7π to 0.5π -->
    <path d="M 112.98 85.28 A 80 80 0 0 1 160 70" fill="none" stroke="rgba(245,158,11,0.55)" stroke-width="18" stroke-linecap="butt"/>

    <!-- Teal 50–100%: t from 0.5π to 0 -->
    <path d="M 160 70 A 80 80 0 0 1 240 150" fill="none" stroke="rgba(6,182,212,0.5)" stroke-width="18" stroke-linecap="butt"/>

    <!-- Needle at ~75%: t = 0.25π -->
    <line x1="160" y1="150" x2="216.57" y2="93.43" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="160" cy="150" r="6" fill="#F1F5F9"/>

    <!-- Value -->
    <text x="160" y="178" text-anchor="middle" font-weight="700" font-size="24" fill="#06B6D4">75%</text>
    <text x="160" y="196" text-anchor="middle" font-size="10" fill="#94a3b8">[metric label]</text>

    <!-- Scale labels (near arc) -->
    <text x="68" y="166" text-anchor="middle" font-size="8" fill="#94a3b8">0</text>
    <text x="252" y="166" text-anchor="middle" font-size="8" fill="#94a3b8">100</text>
    <text x="108" y="78" text-anchor="middle" font-size="8" fill="#94a3b8">30</text>
    <text x="160" y="58" text-anchor="middle" font-size="8" fill="#94a3b8">50</text>

    <!-- Target ~65%: t = 0.35π -->
    <line x1="160" y1="150" x2="203.4" y2="78.6" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="218" y="72" font-size="8" fill="#F59E0B" font-weight="600">Target</text>
  </g>
  <text x="160" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  threshold definitions or SLA context]</text>
</svg>
