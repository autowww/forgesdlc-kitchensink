<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Gauge / meter template</title>
  <desc id="desc">Radial meter arc with needle showing a metric against a target</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="160" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  health score]</text>

    <!-- Background arc (full 180 deg) -->
    <!-- Arc from (-180 deg to 0 deg) centered at 160,150 radius 80 -->
    <path d="M 80 150 A 80 80 0 0 1 240 150" fill="none" stroke="rgba(6,182,212,0.16)" stroke-width="18" stroke-linecap="round"/>

    <!-- Red zone (0-30%): ~54 deg -->
    <path d="M 80 150 A 80 80 0 0 1 90.2 97.4" fill="none" stroke="rgba(239,68,68,0.5)" stroke-width="18" stroke-linecap="round"/>

    <!-- Amber zone (30-60%): ~54 deg -->
    <path d="M 90.2 97.4 A 80 80 0 0 1 137.6 74.8" fill="none" stroke="rgba(245,158,11,0.5)" stroke-width="18"/>

    <!-- Green zone (60-100%): ~72 deg -->
    <path d="M 137.6 74.8 A 80 80 0 0 1 240 150" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="18" stroke-linecap="round"/>

    <!-- Needle (pointing to ~75%) -->
    <line x1="160" y1="150" x2="185" y2="82" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="160" cy="150" r="6" fill="#F1F5F9"/>

    <!-- Value -->
    <text x="160" y="178" text-anchor="middle" font-weight="700" font-size="24" fill="#06B6D4">75%</text>
    <text x="160" y="196" text-anchor="middle" font-size="10" fill="#94a3b8">[metric label]</text>

    <!-- Scale labels -->
    <text x="68" y="166" text-anchor="middle" font-size="8" fill="#94a3b8">0</text>
    <text x="252" y="166" text-anchor="middle" font-size="8" fill="#94a3b8">100</text>
    <text x="100" y="80" text-anchor="middle" font-size="8" fill="#94a3b8">30</text>
    <text x="160" y="62" text-anchor="middle" font-size="8" fill="#94a3b8">50</text>

    <!-- Target line -->
    <line x1="160" y1="150" x2="210" y2="78" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="220" y="74" font-size="8" fill="#F59E0B" font-weight="600">Target</text>
  </g>
  <text x="160" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  threshold definitions or SLA context]</text>
</svg>
