<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Bar chart template</title>
  <desc id="desc">Vertical bars on a labeled axis for category comparison</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="200" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  category comparison]</text>

    <!-- Y-axis -->
    <line x1="60" y1="36" x2="60" y2="240" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="60" text-anchor="end" font-size="8" fill="#708090">100</text>
    <text x="50" y="110" text-anchor="end" font-size="8" fill="#708090">75</text>
    <text x="50" y="160" text-anchor="end" font-size="8" fill="#708090">50</text>
    <text x="50" y="210" text-anchor="end" font-size="8" fill="#708090">25</text>
    <text x="50" y="244" text-anchor="end" font-size="8" fill="#708090">0</text>

    <!-- Grid lines -->
    <g stroke="#1f2937" stroke-width="0.5">
      <line x1="60" y1="56" x2="380" y2="56"/>
      <line x1="60" y1="106" x2="380" y2="106"/>
      <line x1="60" y1="156" x2="380" y2="156"/>
      <line x1="60" y1="206" x2="380" y2="206"/>
    </g>

    <!-- X-axis -->
    <line x1="60" y1="240" x2="380" y2="240" stroke="#334155" stroke-width="1.5"/>

    <!-- Bar A (85%) -->
    <rect x="80" y="68" width="44" height="172" rx="2" fill="#3d5a80"/>
    <text x="102" y="60" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">85</text>
    <text x="102" y="256" text-anchor="middle" font-size="9" fill="#708090">Cat A</text>

    <!-- Bar B (60%) -->
    <rect x="142" y="116" width="44" height="124" rx="2" fill="#2c5282"/>
    <text x="164" y="108" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">60</text>
    <text x="164" y="256" text-anchor="middle" font-size="9" fill="#708090">Cat B</text>

    <!-- Bar C (92%) -->
    <rect x="204" y="54" width="44" height="186" rx="2" fill="#285e61"/>
    <text x="226" y="48" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">92</text>
    <text x="226" y="256" text-anchor="middle" font-size="9" fill="#708090">Cat C</text>

    <!-- Bar D (45%) -->
    <rect x="266" y="146" width="44" height="94" rx="2" fill="#744210"/>
    <text x="288" y="138" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">45</text>
    <text x="288" y="256" text-anchor="middle" font-size="9" fill="#708090">Cat D</text>

    <!-- Bar E (72%) -->
    <rect x="328" y="92" width="44" height="148" rx="2" fill="#553c9a"/>
    <text x="350" y="84" text-anchor="middle" font-size="9" fill="#F1F5F9" font-weight="600">72</text>
    <text x="350" y="256" text-anchor="middle" font-size="9" fill="#708090">Cat E</text>
  </g>
  <text x="200" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  unit of measure or data period]</text>
</svg>
