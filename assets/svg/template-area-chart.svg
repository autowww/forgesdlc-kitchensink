<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Area chart template</title>
  <desc id="desc">Filled region under a trend line on an axis grid</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="200" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  cumulative trend]</text>

    <!-- Y-axis -->
    <line x1="60" y1="36" x2="60" y2="210" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="48" text-anchor="end" font-size="8" fill="#708090">100</text>
    <text x="50" y="92" text-anchor="end" font-size="8" fill="#708090">75</text>
    <text x="50" y="136" text-anchor="end" font-size="8" fill="#708090">50</text>
    <text x="50" y="180" text-anchor="end" font-size="8" fill="#708090">25</text>
    <text x="50" y="214" text-anchor="end" font-size="8" fill="#708090">0</text>

    <!-- Grid -->
    <g stroke="#1f2937" stroke-width="0.5">
      <line x1="60" y1="44" x2="380" y2="44"/>
      <line x1="60" y1="88" x2="380" y2="88"/>
      <line x1="60" y1="132" x2="380" y2="132"/>
      <line x1="60" y1="176" x2="380" y2="176"/>
    </g>

    <!-- X-axis -->
    <line x1="60" y1="210" x2="380" y2="210" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="226" text-anchor="middle" font-size="8" fill="#708090">T1</text>
    <text x="170" y="226" text-anchor="middle" font-size="8" fill="#708090">T2</text>
    <text x="240" y="226" text-anchor="middle" font-size="8" fill="#708090">T3</text>
    <text x="310" y="226" text-anchor="middle" font-size="8" fill="#708090">T4</text>
    <text x="370" y="226" text-anchor="middle" font-size="8" fill="#708090">T5</text>

    <!-- Area fill (Series A) -->
    <polygon points="100,190 170,160 240,120 310,90 370,60 370,210 100,210" fill="rgba(6,182,212,0.15)"/>
    <polyline points="100,190 170,160 240,120 310,90 370,60" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="100" cy="190" r="3" fill="#06B6D4"/>
    <circle cx="170" cy="160" r="3" fill="#06B6D4"/>
    <circle cx="240" cy="120" r="3" fill="#06B6D4"/>
    <circle cx="310" cy="90" r="3" fill="#06B6D4"/>
    <circle cx="370" cy="60" r="3" fill="#06B6D4"/>

    <!-- Area fill (Series B) -->
    <polygon points="100,200 170,190 240,170 310,155 370,140 370,210 100,210" fill="rgba(245,158,11,0.12)"/>
    <polyline points="100,200 170,190 240,170 310,155 370,140" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="100" cy="200" r="3" fill="#F59E0B"/>
    <circle cx="170" cy="190" r="3" fill="#F59E0B"/>
    <circle cx="240" cy="170" r="3" fill="#F59E0B"/>
    <circle cx="310" cy="155" r="3" fill="#F59E0B"/>
    <circle cx="370" cy="140" r="3" fill="#F59E0B"/>

    <!-- Legend -->
    <rect x="100" y="236" width="14" height="8" rx="1" fill="rgba(6,182,212,0.3)"/>
    <text x="120" y="244" font-size="9" fill="#F1F5F9">Area A</text>
    <rect x="200" y="236" width="14" height="8" rx="1" fill="rgba(245,158,11,0.25)"/>
    <text x="220" y="244" font-size="9" fill="#F1F5F9">Area B</text>
  </g>
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  cumulative metric or burn-up context]</text>
</svg>
