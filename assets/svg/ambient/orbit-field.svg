<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="1200" height="640" fill="none"/>
  <g transform="translate(600,310)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="120s" repeatCount="indefinite" calcMode="linear"/>
      <ellipse cx="0" cy="0" rx="220" ry="120" fill="none" stroke="var(--forge-ambient-line-soft, rgba(112,128,144,0.22))" stroke-width="0.9"/>
      <ellipse cx="0" cy="0" rx="160" ry="200" fill="none" stroke="var(--forge-ambient-line, rgba(6,182,212,0.14))" stroke-width="1" stroke-dasharray="6 18" opacity="0.85"/>
      <path fill="none" stroke="var(--forge-ambient-accent, #06B6D4)" stroke-width="0.85" stroke-opacity="0.24" stroke-linecap="round"
        d="M -200,0 A 200,120 0 0 1 200,0"/>
    </g>
    <circle class="fa-orbit-hub" cx="0" cy="0" r="5" fill="var(--forge-ambient-accent-2, #F59E0B)" fill-opacity="0.22">
      <animate attributeName="fill-opacity" values="0.15;0.32;0.15" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="72s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="198" cy="0" r="2.2" fill="var(--forge-ambient-accent, #06B6D4)" fill-opacity="0.5"/>
    </g>
  </g>
</svg>
