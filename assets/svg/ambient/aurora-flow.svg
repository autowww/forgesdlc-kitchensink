  <path fill="none" stroke="var(--forge-ambient-line-soft, rgba(112,128,144,0.28))" stroke-width="1.2" stroke-linecap="round"
    d="M -60,400 C 240,520 480,200 720,360 S 1040,480 1260,280">
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,-12; 0,0" dur="84s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </path>
  <path fill="none" stroke="var(--forge-ambient-line, rgba(6,182,212,0.18))" stroke-width="1.6" stroke-linecap="round" opacity="0.85"
