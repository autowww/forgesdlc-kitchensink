    <animateTransform attributeName="transform" type="translate" values="0,0; -32,16; 0,0" dur="96s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </path>
  <path fill="none" stroke="var(--forge-ambient-accent, #06B6D4)" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.22" stroke-dasharray="14 38"
