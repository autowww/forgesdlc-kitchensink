<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="lt">
  <title id="lt">split_page layout schematic</title>
  <rect width="100%" height="100%" fill="#111827"/>
  <text x="200" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">Example left, docs right (stacks on mobile)</text>
  <g data-node="Site header" pointer-events="all">
    <rect x="24" y="36" width="352" height="40" rx="4" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.55)" stroke-width="1.5"/>
    <text x="200" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#06B6D4" font-weight="600">Site header</text>
  </g>
  <g data-node="Sidebar" pointer-events="all">
    <rect x="24" y="88" width="72" height="152" rx="4" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.4)" stroke-width="1.2"/>
    <text x="60" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#06B6D4" font-weight="600">Sidebar</text>
  </g>
  <g data-node="Example panel" pointer-events="all">
    <rect x="108" y="88" width="132" height="152" rx="4" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.5)" stroke-width="1.2"/>
    <text x="174" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F59E0B" font-weight="600">Example</text>
    <text x="174" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">left_html</text>
  </g>
  <g data-node="Docs panel" pointer-events="all">
    <rect x="252" y="88" width="124" height="152" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.45)" stroke-width="1.2"/>
    <text x="314" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#10B981" font-weight="600">Docs</text>
    <text x="314" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#708090">right_html</text>
  </g>
</svg>
