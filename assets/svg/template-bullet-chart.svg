<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Bullet chart template</title>
  <desc id="desc">Single measure with qualitative ranges, comparative marker, and target</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="180" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  KPI vs bands]</text>

    <text x="24" y="118" font-size="10" fill="#94a3b8" font-weight="600">[Metric]</text>

    <!-- Track background bands: poor / fair / good -->
    <g data-node="Range bands" pointer-events="all">
      <rect x="100" y="88" width="100" height="28" rx="3" fill="rgba(239,68,68,0.2)"/>
      <rect x="200" y="88" width="80" height="28" rx="0" fill="rgba(245,158,11,0.18)"/>
      <rect x="280" y="88" width="56" height="28" rx="3" fill="rgba(6,182,212,0.15)"/>
    </g>

    <!-- Comparative (e.g. prior period) thin bar -->
    <g data-node="Comparative" pointer-events="all">
      <rect x="100" y="96" width="168" height="6" rx="1" fill="rgba(148,163,184,0.45)"/>
    </g>

    <!-- Actual performance thick bar -->
    <g data-node="Actual" pointer-events="all">
      <rect x="100" y="100" width="142" height="14" rx="2" fill="rgba(6,182,212,0.75)"/>
    </g>

    <!-- Target marker -->
    <g data-node="Target" pointer-events="all">
      <line x1="268" y1="82" x2="268" y2="122" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="100" y="82" font-size="7" fill="#94a3b8">0</text>
    <text x="200" y="82" text-anchor="middle" font-size="7" fill="#94a3b8">50</text>
    <text x="336" y="82" text-anchor="end" font-size="7" fill="#94a3b8">100</text>

    <text x="180" y="148" text-anchor="middle" font-size="9" fill="#F1F5F9">Actual <tspan font-weight="700" fill="#06B6D4">71</tspan>
      <tspan fill="#94a3b8"> / Prior </tspan><tspan fill="#94a3b8">65</tspan>
      <tspan fill="#94a3b8"> / Target </tspan><tspan fill="#F59E0B">80</tspan></text>

    <text x="100" y="168" font-size="7" fill="#94a3b8">Poor</text>
    <text x="210" y="168" font-size="7" fill="#94a3b8">Fair</text>
    <text x="292" y="168" font-size="7" fill="#94a3b8">Good</text>
  </g>
  <text x="180" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  period or threshold source]</text>
</svg>
