<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Nested donut chart template</title>
  <desc id="desc">Two concentric rings showing hierarchical or dual breakdowns</desc>
  <rect width="100%" height="100%" fill="#111827"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="180" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  two-level breakdown]</text>

    <!-- Outer ring r=88, stroke 22 -->
    <g data-node="Outer W" pointer-events="all">
    <circle cx="180" cy="135" r="88" fill="none" stroke="#1a2235" stroke-width="22"
            stroke-dasharray="193 360" stroke-dashoffset="0" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    <rect x="48" y="218" width="12" height="12" rx="2" fill="#1a2235"/>
    <text x="66" y="229" font-size="10" fill="#F1F5F9">Outer W <tspan fill="#94a3b8">40%</tspan></text>
    </g>
    <g data-node="Outer X" pointer-events="all">
    <circle cx="180" cy="135" r="88" fill="none" stroke="#1e2d42" stroke-width="22"
            stroke-dasharray="138 360" stroke-dashoffset="-193" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    <rect x="48" y="238" width="12" height="12" rx="2" fill="#1e2d42"/>
    <text x="66" y="249" font-size="10" fill="#F1F5F9">Outer X <tspan fill="#94a3b8">28%</tspan></text>
    </g>
    <g data-node="Outer Y" pointer-events="all">
    <circle cx="180" cy="135" r="88" fill="none" stroke="#1c3148" stroke-width="22"
            stroke-dasharray="97 360" stroke-dashoffset="-331" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    <rect x="200" y="218" width="12" height="12" rx="2" fill="#1c3148"/>
    <text x="218" y="229" font-size="10" fill="#F1F5F9">Outer Y <tspan fill="#94a3b8">20%</tspan></text>
    </g>
    <g data-node="Outer Z" pointer-events="all">
    <circle cx="180" cy="135" r="88" fill="none" stroke="rgba(245,158,11,0.28)" stroke-width="22"
            stroke-dasharray="72 360" stroke-dashoffset="-428" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    <rect x="200" y="238" width="12" height="12" rx="2" fill="rgba(245,158,11,0.28)"/>
    <text x="218" y="249" font-size="10" fill="#F1F5F9">Outer Z <tspan fill="#94a3b8">12%</tspan></text>
    </g>

    <!-- Inner ring r=54, stroke 18 -->
    <g data-node="Inner P" pointer-events="all">
    <circle cx="180" cy="135" r="54" fill="none" stroke="rgba(6,182,212,0.55)" stroke-width="18"
            stroke-dasharray="170 340" stroke-dashoffset="0" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    </g>
    <g data-node="Inner Q" pointer-events="all">
    <circle cx="180" cy="135" r="54" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="18"
            stroke-dasharray="102 340" stroke-dashoffset="-170" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    </g>
    <g data-node="Inner R" pointer-events="all">
    <circle cx="180" cy="135" r="54" fill="none" stroke="rgba(245,158,11,0.35)" stroke-width="18"
            stroke-dasharray="68 340" stroke-dashoffset="-272" transform="rotate(-90 180 135)" pointer-events="stroke"/>
    </g>

    <circle cx="180" cy="135" r="28" fill="#111827"/>
    <text x="180" y="130" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="13">100%</text>
    <text x="180" y="144" text-anchor="middle" fill="#94a3b8" font-size="8">inner / outer</text>

    <text x="180" y="276" text-anchor="middle" font-size="8" fill="#94a3b8">Inner: P, Q, R</text>
  </g>
  <text x="180" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">[Footer note  hierarchy or period]</text>
</svg>
