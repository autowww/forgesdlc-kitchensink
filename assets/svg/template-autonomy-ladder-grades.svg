<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Autonomy ladder template with grade axis and sub-level bands</title>
  <desc id="desc">Placeholder diagram archetype for an autonomy ladder showing level steps, a maturity grade axis, and sub-level bands. Replace bracketed labels with content-specific values in consuming repos.</desc>
  <rect width="100%" height="100%" fill="none"/>
  <text x="410" y="18" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#06B6D4">[Title  autonomy ladder with grades and sub-levels]</text>
  <g font-family="system-ui, sans-serif">
    <!-- Placeholder level steps -->
    <rect x="12" y="170" width="64" height="28" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="44" y="188" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">[Level]</text>
    <rect x="84" y="140" width="64" height="58" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="116" y="158" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">[Level]</text>
    <text x="116" y="172" text-anchor="middle" fill="#e0f2fe" font-size="7">[unit]</text>
    <rect x="156" y="110" width="64" height="88" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="188" y="128" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">[Level]</text>
    <rect x="228" y="80" width="64" height="118" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="260" y="98" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">[Level]</text>
    <rect x="300" y="120" width="64" height="78" rx="3" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="332" y="138" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">[Level]</text>
    <!-- Sub-level band placeholders on one step -->
    <rect x="88" y="188" width="56" height="10" rx="2" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="116" y="196" text-anchor="middle" fill="#e0f2fe" font-size="5.5">[Sub-level]</text>
    <rect x="160" y="188" width="56" height="10" rx="2" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="188" y="196" text-anchor="middle" fill="#e0f2fe" font-size="5.5">[Sub-level]</text>
    <!-- Grade axis -->
    <rect x="620" y="48" width="180" height="200" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="710" y="66" text-anchor="middle" fill="#06B6D4" font-weight="700" font-size="9">Maturity grades</text>
    <text x="636" y="92" fill="#94a3b8" font-size="8">[Grade a]  [Defined]</text>
    <text x="636" y="112" fill="#f59e0b" font-size="8" font-weight="700">[Grade b]  [Demonstrated]</text>
    <text x="636" y="132" fill="#94a3b8" font-size="8">[Grade c]  [Repeatable]</text>
    <text x="636" y="152" fill="#94a3b8" font-size="8">[Grade d]  [Operational]</text>
    <line x1="296" y1="36" x2="296" y2="210" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="154" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#06B6D4">[exercised band]</text>
    <text x="460" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">[vision band]</text>
  </g>
  <text x="410" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">[Footer note  higher levels add gates and never remove lower-level gates]</text>
</svg>
