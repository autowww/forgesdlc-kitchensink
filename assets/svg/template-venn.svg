<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram template</title>
  <desc id="desc">Overlapping circles showing concept intersections</desc>
  <rect width="100%" height="100%" fill="none"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="210" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#06B6D4">[Title  concept overlap]</text>

    <!-- Circle A -->
    <circle cx="160" cy="140" r="90" fill="rgba(44,82,130,0.25)" stroke="#2c5282" stroke-width="2"/>
    <text x="110" y="115" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Set A</text>
    <text x="110" y="132" text-anchor="middle" fill="#708090" font-size="9">[description]</text>

    <!-- Circle B -->
    <circle cx="260" cy="140" r="90" fill="rgba(40,94,97,0.25)" stroke="#285e61" stroke-width="2"/>
    <text x="310" y="115" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Set B</text>
    <text x="310" y="132" text-anchor="middle" fill="#708090" font-size="9">[description]</text>

    <!-- Circle C -->
    <circle cx="210" cy="220" r="90" fill="rgba(116,66,16,0.25)" stroke="#744210" stroke-width="2"/>
    <text x="210" y="270" text-anchor="middle" fill="#F1F5F9" font-weight="700" font-size="11">Set C</text>
    <text x="210" y="287" text-anchor="middle" fill="#708090" font-size="9">[description]</text>

    <!-- Intersection labels -->
    <text x="210" y="130" text-anchor="middle" fill="#06B6D4" font-weight="600" font-size="9">A ) B</text>
    <text x="160" y="200" text-anchor="middle" fill="#06B6D4" font-weight="600" font-size="9">A ) C</text>
    <text x="260" y="200" text-anchor="middle" fill="#06B6D4" font-weight="600" font-size="9">B ) C</text>
    <text x="210" y="176" text-anchor="middle" fill="#F59E0B" font-weight="700" font-size="9">A)B)C</text>
  </g>
</svg>
