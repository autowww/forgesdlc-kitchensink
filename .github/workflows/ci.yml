name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  forge-autodoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forge-autodoc (dev)
        run: pip install -e "./forge-autodoc[dev]"
      - name: Test forge-autodoc
        run: pytest forge-autodoc/tests -q

  design-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/design-catalog/package-lock.json
      - name: Install forge-autodoc (dev)
        run: pip install -e "./forge-autodoc[dev]"
      - name: npm ci (design catalog)
        working-directory: tools/design-catalog
        run: npm ci
      - name: npm ci (showcase React app)
        working-directory: showcase-react-app
        run: npm ci
      - name: Build showcase React bundle
        working-directory: showcase-react-app
        run: npm run build
      - name: Build showcase (HTML markers)
        run: python3 generator/build-showcase.py
      - name: Consumer hash marker smoke (showcase HTML)
        run: node tools/design-catalog/check-consumer-hashes.mjs --repo . --dir showcase --strict
      - name: Inventory KS visuals
        run: node tools/design-catalog/inventory-ks-visuals.mjs --repo . --out docs/design/catalog/visual-inventory.generated.json
      - name: Validate visual catalog
        run: node tools/design-catalog/check-visual-catalog.mjs --repo . --registry docs/design/catalog/visual-registry.yaml --showcase showcase
      - name: Design catalog negative fixture
        run: bash tools/design-catalog/verify-bad-fixture.sh
      - name: Test forge-autodoc
        run: pytest forge-autodoc/tests -q
      - name: npm ci (Forge Website UX Auditor)
        working-directory: tools/website-ux-auditor
        run: npm ci
      - name: Test Forge Website UX Auditor
        working-directory: tools/website-ux-auditor
        run: npm test

  website-ux-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/website-ux-auditor/package-lock.json
      - name: npm ci (Forge Website UX Auditor)
        working-directory: tools/website-ux-auditor
        run: npm ci
      - name: Test Forge Website UX Auditor
        working-directory: tools/website-ux-auditor
        run: npm test

  website-a11y-auditor:
    runs-on: ubuntu-latest
    env:
      FORGE_A11Y_SKIP_AI_AGENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/website-a11y-auditor/package-lock.json
      - name: npm ci (Forge Website A11y Auditor)
        working-directory: tools/website-a11y-auditor
        run: |
          npm ci
          npm run vendor:axe
      - name: Test Forge Website A11y Auditor
        working-directory: tools/website-a11y-auditor
        run: |
          npm run bootstrap-wcag-seeds
          npm run generate-pilot-registry
          npm run generate-ai-fixer-registry
          npm run export-axe-catalog
          npm test
