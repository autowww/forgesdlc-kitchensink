<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
</head>
<body>
  <main style="width: 1400px;">
    <h1>Contact</h1>
    <form method="post">

    <a href="https://external.example" target="_blank">External</a>
    <img src="wide.png" alt="">
  </main>
</body>
</html>
