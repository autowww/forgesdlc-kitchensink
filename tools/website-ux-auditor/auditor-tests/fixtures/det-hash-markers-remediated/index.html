<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
  (function(){try{var m=document.cookie.match(/(?:^|;)\s*forge_color_scheme=([^;]*)/);var v=m?decodeURIComponent(m[1].trim()):'';var mq=window.matchMedia('(prefers-color-scheme: dark)');var t='dark';if(v==='light')t='light';else if(v==='dark')t='dark';else if(v==='auto')t=mq.matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Remediated harness fixture for DET.HASH.MARKERS — paired hash markers on every governed visual root." />
  <title>Visual hash marker pairing — remediated fixture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/forge-theme.css" />
</head>
<body>
<div class="forge-aurora"></div>
<a href="#main" class="skip-link">Skip to content</a>
<div class="dropdown forge-theme-dropdown position-fixed top-0 end-0 m-2" style="z-index:1050" data-forge-pref="dark">
  <button type="button" class="forge-theme-trigger dropdown-toggle" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" id="forgeThemeMenu" aria-haspopup="true" aria-label="Appearance and color theme" title="Theme">
    <span class="forge-theme-trigger__inner">
      <span class="forge-theme-trigger__copy">
        <span class="forge-theme-eyebrow">Appearance</span>
        <span class="forge-theme-current">Dark</span>
      </span>
    </span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end forge-theme-menu" aria-labelledby="forgeThemeMenu">
    <li><button type="button" class="dropdown-item forge-theme-option" data-forge-color-scheme="light"><span>Light</span></button></li>
    <li><button type="button" class="dropdown-item forge-theme-option active" data-forge-color-scheme="dark"><span>Dark</span></button></li>
    <li><button type="button" class="dropdown-item forge-theme-option" data-forge-color-scheme="auto"><span>System</span></button></li>
  </ul>
</div>

<div
  class="container-fluid px-0"
  hash="Hbk"
  data-ks-hash="Hbk"
  data-ks-type="layout"
  data-ks-name="layout-handbook"
>
  <div class="row g-0 flex-lg-nowrap min-vh-100">
    <aside
      class="forge-sidebar col-lg-3 col-xl-2 d-none d-lg-flex flex-column p-0"
      hash="Ksr"
      data-ks-hash="Ksr"
      data-ks-type="chrome-region"
      data-ks-name="doc-sidebar"
      style="min-height:100vh;position:sticky;top:0;overflow-y:auto;align-self:flex-start;max-height:100vh"
    >
      <div class="px-3 py-3" style="border-bottom:1px solid var(--forge-border)">
        <p class="forge-brand mb-0">
          <span class="brand-icon">F</span>
          <span class="text-amber">Forge SDLC</span>
        </p>
      </div>
      <nav class="nav-scroll flex-grow-1 px-2 py-3" aria-label="Primary navigation">
        <p class="nav-section-label">Chapters</p>
        <div class="nav-rail">
          <a href="/docs/start" class="nav-link active">Getting started</a>
        </div>
      </nav>
    </aside>
    <main
      id="main"
      class="col-lg-9 col-xl-10 px-3 px-md-5 pt-4 pt-lg-5 pb-5"
      hash="Vhb"
      data-ks-hash="Vhb"
      data-ks-type="layout-preview"
      data-ks-name="preview-handbook"
    >
      <div class="mx-auto doc-content" style="max-width:56rem">
        <header class="mb-4 pb-3" style="border-bottom:1px solid var(--forge-border)">
          <p class="section-label text-cyan mb-2">Handbook</p>
          <h1 class="font-display" style="font-size:clamp(1.75rem,4vw,2.5rem)">Handbook sample page</h1>
          <p class="forge-support mt-2 mb-0" style="font-size:1rem">Markers pair on every governed root.</p>
        </header>
        <div
          hash="Ksf"
          data-ks-hash="Ksf"
          data-ks-type="chrome-region"
          data-ks-name="site-footer"
          class="ks-site-footer-region border-top py-4 mt-4"
          style="border-color: var(--forge-border);"
        >
          <p class="forge-support mb-0 text-center">Footer hash paired · DET ruleset harness fixture · ephemeral</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="assets/forge-theme.js"></script>
<script src="assets/showcase.js"></script>
</body>
</html>
